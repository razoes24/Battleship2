# 129856 - Bruno Frasco
name: Checkstyle gate 129856
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    name: checkstyle-129856
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129856.xml
          reporter: github-pr-review
          filter_mode: nofilter
          level: error
          fail_level: error