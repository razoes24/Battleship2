name: Checkstyle gate 131834

on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    name: checkstyle-131834
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-131834.xml
          reporter: github-pr-review
          filter_mode: nofilter
          level: error
          fail_level: error
