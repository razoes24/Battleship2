# Workflow temporário (129854): gera o relatório HTML de cobertura JaCoCo
# só das classes Tasks, Scoreboard e ScoreEntry, correndo só os testes delas.
name: Coverage report 129854

on:
  push:
    branches: [ "UnitTests_129854" ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Run TasksTest, ScoreboardTest and ScoreEntryTest with JaCoCo
      run: mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test -Dtest='TasksTest,ScoreboardTest,ScoreEntryTest' -Dsurefire.failIfNoSpecifiedTests=false
    - name: Get JaCoCo CLI
      run: mvn -B dependency:copy -Dartifact=org.jacoco:org.jacoco.cli:0.8.12:jar:nodeps -DoutputDirectory=target/jacoco-cli
    - name: HTML report for the 3 classes
      run: |
        ARGS=""
        for f in target/classes/battleship/Tasks*.class target/classes/battleship/Scoreboard*.class target/classes/battleship/ScoreEntry*.class; do ARGS="$ARGS --classfiles $f"; done
        java -jar target/jacoco-cli/org.jacoco.cli-0.8.12-nodeps.jar report target/jacoco.exec $ARGS \
          --sourcefiles src/main/java --encoding UTF-8 \
          --name "Cobertura dos testes de 129854 (Tasks, Scoreboard, ScoreEntry)" \
          --html reports/LEI-129854 --csv target/coverage-129854.csv
        cat target/coverage-129854.csv
    - name: Report as base64
      run: |
        echo "REPORT_B64_BEGIN"
        tar czf - -C reports LEI-129854 | base64 -w0
        echo
        echo "REPORT_B64_END"
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-report-129854
        path: reports/LEI-129854
