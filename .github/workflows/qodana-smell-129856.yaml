# 129856 - Bruno Frasco
name: Qodana smell gate 129856
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    name: qodana-smell-129856
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129856.yaml --image jetbrains/qodana-jvm-community:2026.2
          use-annotations: true
          post-pr-comment: true
          upload-result: true