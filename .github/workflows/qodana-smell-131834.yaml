# 131834 - Pedro Silva
name: Qodana smell gate 131834

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    name: qodana-smell-131834
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Usar a minha configuração Qodana
        run: cp qodana-131834.yaml qodana.yaml

      - uses: JetBrains/qodana-action@v2026.2
        with:
          use-annotations: true
          post-pr-comment: true
          pr-mode: false
